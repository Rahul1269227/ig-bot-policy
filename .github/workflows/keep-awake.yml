# Wakes the comment bot on Render's free plan if it has gone to sleep.
# The bot pings itself while running; this covers the case where it's
# already asleep (after a deploy, crash, or missed self-ping).
name: Keep bot awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://ig-growth-analyzer.onrender.com/health -o /dev/null -w "%{http_code} in %{time_total}s\n"
